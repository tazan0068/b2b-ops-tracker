      };
    });
    var so = $("#fsort"); if (so) so.onchange = function () { flt.sort = so.value; repaint(true); };
    var fq = $("#fq");
    if (fq) {
      fq.oninput = function () {
        clearTimeout(fq._t);
        fq._t = setTimeout(function () {
          flt.q = fq.value; repaint(true);
          var n = $("#fq"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        }, 260);
      };
    }

    /* ---- 편집: 하위업무 ---- */
    $$("[data-te]").forEach(function (el) {
      var handler = function () {
        var p = parseKey(el.getAttribute("data-te")), f = el.getAttribute("data-f");
        var pj = project(p.id); if (!pj || !pj.tasks[p.i]) return;
        if (f === "p") {
          var v = Math.max(0, Math.min(100, Number(el.value) || 0));
          pj.tasks[p.i].p = v;
          $$("[data-te='" + el.getAttribute("data-te") + "'][data-f='p']").forEach(function (o) { if (o !== el) o.value = v; });
          var d = el.closest(".btk-d, .tt-d");
          if (d && d.previousElementSibling) {
            var btn = d.previousElementSibling;
            var vs = btn.querySelector(".v, .tt-v"); if (vs) vs.textContent = v;
            var bar = btn.querySelector(".mb"); if (bar) bar.outerHTML = mb(v, barCls(tkState(v)));
            btn.className = btn.className.replace(/k-\w+/, "k-" + tkState(v));
          }
        } else {
          pj.tasks[p.i][f] = el.value;
          if (f === "t") {
            var dd = el.closest(".btk-d, .tt-d");
            if (dd && dd.previousElementSibling) {
              var nn = dd.previousElementSibling.querySelector(".n .t, .n, .tt-n .t");
              if (nn && nn.firstChild && nn.firstChild.nodeType === 3) nn.firstChild.nodeValue = el.value;
              else if (nn) nn.textContent = el.value;
            }
          }
        }
        el.classList.add("dirty"); save();
      };
      el.oninput = handler;
      if (el.type === "range") el.onchange = handler;
    });
    $$("[data-tdel]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var p = parseKey(b.getAttribute("data-tdel")), pj = project(p.id);
        if (!pj || !pj.tasks[p.i]) return;
        if (!confirm('"' + pj.tasks[p.i].t + '" 업무를 삭제합니다. 계속할까요?')) return;
        pj.tasks.splice(p.i, 1); open = {}; save(); repaint(true); toast("삭제했습니다");
      };
    });
    $$("[data-tadd]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var pj = project(b.getAttribute("data-tadd")); if (!pj) return;
        pj.tasks = pj.tasks || [];
        pj.tasks.push({ t: "새 하위업무", p: 0, n: "", r: "" });
        jOpen[pj.id] = true; open[pj.id + ":" + (pj.tasks.length - 1)] = true;
        save(); repaint(true); toast("하위업무를 추가했습니다");
      };
    });

    /* ---- 편집: 프로젝트 ---- */
    $$("[data-pjedit]").forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); var id = b.getAttribute("data-pjedit"); pjEdit = pjEdit === id ? null : id; repaint(true); };
    });
    $$("[data-pjclose]").forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); pjEdit = null; repaint(true); }; });
    $$("[data-pe]").forEach(function (el) {
      el.oninput = el.onchange = function () {
        var pj = project(el.getAttribute("data-pe")); if (!pj) return;
        var f = el.getAttribute("data-f");
        pj[f] = el.value; el.classList.add("dirty"); save();
        if (f === "owner" || f === "prog") repaint(true);
      };
    });
    $$("[data-pjdel]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-pjdel"), pj = project(id); if (!pj) return;
        if (!confirm('"' + pj.name + '" 프로젝트와 하위업무 ' + (pj.tasks || []).length + "건을 모두 삭제합니다. 계속할까요?")) return;
        D.projects = D.projects.filter(function (p) { return p.id !== id; });
        pjEdit = null; open = {}; save(); repaint(true); toast("삭제했습니다");
      };
    });
    $$("[data-pjadd]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var mid = b.getAttribute("data-pjadd");
        var id = newId(mid.slice(0, 1).toUpperCase() + "X");
        D.projects.push({ id: id, prog: D.programs[0] ? D.programs[0].id : "", owner: mid, name: "새 프로젝트", note: "", tasks: [{ t: "새 하위업무", p: 0, n: "", r: "" }] });
        jOpen[id] = true; pjEdit = id; save(); repaint(true); toast("프로젝트를 추가했습니다");
      };
    });

    /* ---- 편집: 루틴 ---- */
    $$("[data-re]").forEach(function (el) {
      el.oninput = el.onchange = function () {
        var p = parseKey(el.getAttribute("data-re"));
        var r = (D.routines[p.id] || [])[p.i]; if (!r) return;
        r[el.getAttribute("data-f")] = el.value;
        el.classList.add("dirty"); save();
      };
    });
    $$("[data-rdel]").forEach(function (b) {
      b.onclick = function () {
        var p = parseKey(b.getAttribute("data-rdel"));
        if (!D.routines[p.id] || !D.routines[p.id][p.i]) return;
        D.routines[p.id].splice(p.i, 1); save(); repaint(true);
      };
    });
    $$("[data-radd]").forEach(function (b) {
      b.onclick = function () {
        var mid = b.getAttribute("data-radd");
        D.routines[mid] = D.routines[mid] || [];
        D.routines[mid].push({ id: newId("R"), t: "새 루틴 업무", cy: "주", done: false });
        save(); repaint(true);
      };
    });

    /* ---- 관리 ---- */
    $$("[data-m]").forEach(function (el) {
      el.oninput = el.onchange = function () {
        D.members[+el.getAttribute("data-m")][el.getAttribute("data-f")] = el.value;
        el.classList.add("dirty"); save();
        if (el.getAttribute("data-f") === "color") repaint(true);
      };
    });
    $$("[data-meta]").forEach(function (el) {
      el.oninput = function () {
        D.meta[el.getAttribute("data-meta")] = el.value; el.classList.add("dirty"); save();
        var td = $("#today"); if (td) td.textContent = D.meta.baseDate;
      };
    });
    $$("[data-pg]").forEach(function (el) {
      el.oninput = function () { D.programs[+el.getAttribute("data-pg")][el.getAttribute("data-f")] = el.value; el.classList.add("dirty"); save(); };
    });
    $$("[data-k]").forEach(function (el) {
      el.onchange = el.oninput = function () {
        var k = D.kpis[+el.getAttribute("data-k")], f = el.getAttribute("data-f");
        if (f === "measured") { k.measured = el.value === "1"; if (!k.measured) k.cur = null; }
        else if (f === "owner") k.owner = el.value;
        else k[f] = el.value === "" ? null : Number(el.value);
        if (f === "cur" && el.value !== "") k.measured = true;
        el.classList.add("dirty"); save();
      };
    });
    $$("[data-l]").forEach(function (el) {
      el.oninput = function () { D.links[+el.getAttribute("data-l")].url = el.value.trim(); el.classList.add("dirty"); save(); };
    });
    /* 허브 링크 */
    $$("[data-le]").forEach(function (el) {
      el.oninput = el.onchange = function () {
        var l = D.links[+el.getAttribute("data-le")]; if (!l) return;
        l[el.getAttribute("data-f")] = el.value;
        el.classList.add("dirty"); save();
        if (el.getAttribute("data-f") === "cat") repaint(true);
      };
    });
    $$("[data-ldel]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-ldel"), l = D.links[i]; if (!l) return;
        if (!confirm('"' + l.name + '" 링크를 지웁니다. 계속할까요?')) return;
        D.links.splice(i, 1); save(); repaint(true); toast("삭제했습니다");
      };
    });
    $$("[data-ladd]").forEach(function (b) {
      b.onclick = function () {
        var used = {}; D.links.forEach(function (x) { used[x.id] = 1; });
        var n = 1; while (used["L" + n]) n++;
        D.links.push({ id: "L" + n, name: "새 화면", cat: b.getAttribute("data-ladd"),
          owner: D.members[0].id, url: "", kpi: "", d: "" });
        save(); repaint(true); toast("링크를 추가했습니다");
      };
    });
    /* 지표 정의 */
    $$("[data-ke]").forEach(function (el) {
      el.oninput = el.onchange = function () {
        var k = D.kpis[+el.getAttribute("data-ke")], f = el.getAttribute("data-f"); if (!k) return;
        if (f === "measured") { k.measured = el.value === "1"; if (!k.measured) k.cur = null; repaint(true); return; }
        if (f === "funnel") { k.funnel = el.value === "1"; repaint(true); return; }
        if (f === "cur" || f === "target") {
          k[f] = el.value === "" ? null : Number(el.value);
          if (f === "cur" && el.value !== "") k.measured = true;
        } else k[f] = el.value;
        el.classList.add("dirty"); save();
      };
    });
    $$("[data-kdel]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var i = +b.getAttribute("data-kdel"), k = D.kpis[i]; if (!k) return;
        if (!confirm('"' + k.name + '" 지표를 삭제합니다. 프로그램·링크 연결도 함께 끊깁니다. 계속할까요?')) return;
        var id = k.id;
        D.kpis.splice(i, 1);
        D.programs.forEach(function (g) { g.kpis = (g.kpis || []).filter(function (x) { return x !== id; }); });
        D.links.forEach(function (l) { if (l.kpi === id) l.kpi = ""; });
        save(); repaint(true); toast("삭제했습니다");
      };
    });
    var ka = $("#btnKAdd");
    if (ka) ka.onclick = function () {
      var used = {}; D.kpis.forEach(function (x) { used[x.id] = 1; });
      var n = 1; while (used["K" + n]) n++;
      var st = D.kpis.reduce(function (a, x) { return Math.max(a, x.stage || 0); }, 0) + 1;
      D.kpis.push({ id: "K" + n, stage: st, funnel: false, name: "새 지표", owner: D.members[0].id,
        plain: "", formula: "", cur: null, target: 100, unit: "%", dir: "up", measured: false,
        src: "", low: "", lever: "", check: "" });
      kopen["K" + n] = true; save(); repaint(true); toast("지표를 추가했습니다");
    };
    /* 공고문 요약 */
    $$("[data-bs]").forEach(function (el) {
      el.oninput = function () {
        var x = D.bid.stats[+el.getAttribute("data-bs")]; if (!x) return;
        x[el.getAttribute("data-f")] = el.value; el.classList.add("dirty"); save();
      };
    });
    $$("[data-goal]").forEach(function (el) {
      el.oninput = function () { D.meta.goal = el.value; el.classList.add("dirty"); save(); };
    });
    $$("[data-bm]").forEach(function (el) {
      el.oninput = function () { D.bid[el.getAttribute("data-bm")] = el.value; el.classList.add("dirty"); save(); };
    });
    /* 프로그램 */
    $$("[data-pge]").forEach(function (el) {
      el.oninput = function () {
        var g = D.programs[+el.getAttribute("data-pge")]; if (!g) return;
        g[el.getAttribute("data-f")] = el.value; el.classList.add("dirty"); save();
      };
    });
    $$("[data-pgk]").forEach(function (el) {
      el.onchange = function () {
        var g = D.programs[+el.getAttribute("data-pgk")]; if (!g) return;
        g.kpis = g.kpis || [];
        var v = el.value;
        if (el.checked) { if (g.kpis.indexOf(v) < 0) g.kpis.push(v); }
        else g.kpis = g.kpis.filter(function (x) { return x !== v; });
        save(); repaint(true);
      };
    });
    $$("[data-pgdel]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-pgdel"), g = D.programs[i]; if (!g) return;
        var np = D.projects.filter(function (x) { return x.prog === g.id; }).length;
        if (!confirm('"' + g.name + '" 프로그램을 지웁니다. 소속 프로젝트 ' + np + "개는 '미지정'이 됩니다. 계속할까요?")) return;
        D.programs.splice(i, 1); save(); repaint(true); toast("삭제했습니다");
      };
    });
    var pa = $("#btnPgAdd");
    if (pa) pa.onclick = function () {
      var used = {}; D.programs.forEach(function (x) { used[x.id] = 1; });
      var n = 1; while (used["P" + n]) n++;
      D.programs.push({ id: "P" + n, name: "새 프로그램", owner: "jjy", goal: "", kpis: [] });
      save(); repaint(true); toast("프로그램을 추가했습니다");
    };
    /* 팀원 */
    $$("[data-mdel]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute("data-mdel"), m = D.members[i]; if (!m) return;
        if (D.members.length <= 1) { toast("팀원은 최소 1명이 필요합니다"); return; }
        if (!confirm(esc(m.name) + " 님을 팀원 목록에서 지웁니다. 계속할까요?")) return;
        D.members.splice(i, 1); save(); repaint(true); toast("삭제했습니다");
      };
    });
    var ma = $("#btnMAdd");
    if (ma) ma.onclick = function () {
      var used = {}; D.members.forEach(function (x) { used[x.id] = 1; });
      var n = 1; while (used["m" + n]) n++;
      var id = "m" + n;
      D.members.push({ id: id, name: "새 팀원", role: "매니저", focus: "", scope: "" });
      D.routines[id] = []; D.personal[id] = [];
      save(); repaint(true); toast("팀원을 추가했습니다");
    };
    $$("[data-wkn]").forEach(function (el) {
      el.oninput = function () { D.workKpis[+el.getAttribute("data-wkn")].n = el.value; el.classList.add("dirty"); save(); };
    });
    $$("[data-wk]").forEach(function (el) {
      el.oninput = function () {
        D.workKpis[+el.getAttribute("data-wk")].target = Math.max(0, Number(el.value) || 0);
        el.classList.add("dirty"); save();
      };
    });

    var e1 = $("#btnExp"); if (e1) e1.onclick = function () {
      var json = JSON.stringify(D, null, 2), name = "b2b-tracker-" + D.meta.baseDate + ".json";
      if (DL) {
        DL.save({ filename: name, data: json }).then(
          function () { toast("JSON 파일을 내려받았습니다"); },
          function (err) { toast(err && err.code === "declined" ? "저장을 취소했습니다" : "저장하지 못했습니다"); });
        return;
      }
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("JSON 파일을 내려받았습니다");
    };
    var e2 = $("#btnImp"); if (e2) e2.onclick = function () { $("#fileImp").click(); };
    var e3 = $("#fileImp"); if (e3) e3.onchange = function () {
      var f = e3.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result);
          if (!o.meta || !o.members || !o.kpis) throw new Error("bad");
          o = migrateTeam(o);
          if (!o.routines) o.routines = clone(SEED.routines);
          if (!o.workKpis) o.workKpis = clone(SEED.workKpis);
          if (!o.automations) o.automations = clone(SEED.automations);
          D = o; save(); repaint(false); toast("가져왔습니다");
        } catch (err) { toast("불러오지 못했습니다 — 이 트래커가 내보낸 JSON인지 확인해 주세요"); }
      };
      r.readAsText(f);
    };
    var e4 = $("#btnSeed"); if (e4) e4.onclick = function () {
      if (!confirm("수정 내용을 버리고 기준선(" + SEED.meta.baseline + ") 상태로 되돌립니다. 계속할까요?")) return;
      D = clone(SEED); open = {}; jOpen = {}; auOpen = {}; pjEdit = null; save(); repaint(false); toast("기준선으로 되돌렸습니다");
    };
    var e5 = $("#btnWipe"); if (e5) e5.onclick = function () {
      if (!confirm("구조와 지표 정의는 남기고 진행률·측정값·루틴 체크만 비웁니다. 계속할까요?")) return;
      D.projects.forEach(function (p) { (p.tasks || []).forEach(function (t) { t.p = 0; }); });
      D.kpis.forEach(function (k) { k.cur = null; k.measured = false; });
      Object.keys(D.routines).forEach(function (id) { D.routines[id].forEach(function (r) { r.done = false; }); });
      Object.keys(D.personal).forEach(function (id) {
        D.personal[id].forEach(function (x) { if (!x.auto && !x.kpi) x.cur = null; });
      });
      save(); repaint(false); toast("업무·지표 값을 비웠습니다");
    };
  }

  /* ---------- 시작 ---------- */
  function boot() {
    D = load();
    var h = (location.hash || "").replace("#", "");
    if (PAGES.some(function (p) { return p.id === h; })) cur = h;
    $("#today").textContent = D.meta.baseDate;
    render();
    recoWatch();
    window.addEventListener("resize", function () { if (cur === "map") drawMap(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

</body>
</html>
